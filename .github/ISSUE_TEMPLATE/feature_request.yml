name: Feature request
description: Suggest an API or developer-experience improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the user problem first. Do not include API keys, phone numbers, OTPs, or message bodies.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish, and what is difficult today?
      placeholder: As a user of the SDK, I want to...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you would like to see.
      placeholder: I would like a client method that...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative designs have you tried?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links to relevant provider documentation or examples.
